<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nirman Society Gym</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--fire:#FF5722;--fire2:#FF8C00;--dark:#0D1117;--dark2:#161B22;--card:#1C2128;--border:#30363D;--text:#E6EDF3;--muted:#8B949E;--green:#3FB950;--red:#F85149}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Baloo 2','Noto Sans Devanagari',sans-serif;background:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background-image:radial-gradient(ellipse at 20% 10%,rgba(255,87,34,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(255,140,0,.06) 0%,transparent 50%)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 22px 24px;width:100%;max-width:400px;box-shadow:0 0 0 1px rgba(255,87,34,.1),0 24px 64px rgba(0,0,0,.5);animation:fadeUp .4s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .header{text-align:center;margin-bottom:22px}
    .dumbbell-icon{font-size:52px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,87,34,.6));animation:pulse 2.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(255,87,34,.5))}50%{filter:drop-shadow(0 0 22px rgba(255,87,34,.9))}}
    .header h1{font-size:20px;font-weight:800;color:var(--text);margin-top:10px}
    .header p{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:1px;text-transform:uppercase}
    hr.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
    .section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:8px}
    .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
    .form-group input,.form-group select{width:100%;padding:13px 16px;background:var(--dark2);border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
    .form-group input::placeholder{color:var(--muted)}
    .form-group input:focus,.form-group select:focus{border-color:var(--fire);box-shadow:0 0 0 3px rgba(255,87,34,.15)}
    .form-group select option{background:var(--dark2)}
    .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .2s;letter-spacing:.3px}
    .btn:active{transform:scale(.96)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:linear-gradient(135deg,var(--fire),var(--fire2));color:white;box-shadow:0 4px 24px rgba(255,87,34,.35);margin-top:6px}
    .btn-in{background:linear-gradient(135deg,#1a4d2e,#2d7a47);border:1.5px solid var(--green);color:var(--green);font-size:20px;padding:22px;box-shadow:0 4px 24px rgba(63,185,80,.25)}
    .btn-out{background:linear-gradient(135deg,#4d1a1a,#7a2d2d);border:1.5px solid var(--red);color:var(--red);font-size:20px;padding:22px;box-shadow:0 4px 24px rgba(248,81,73,.25)}
    .member-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:20px;text-align:center}
    .member-avatar{width:56px;height:56px;background:linear-gradient(135deg,var(--fire),var(--fire2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
    .member-name{font-size:20px;font-weight:800;color:var(--text)}
    .member-meta{font-size:13px;color:var(--muted);margin-top:4px}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:10px;text-transform:uppercase;letter-spacing:.5px}
    .badge-in{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.3)}
    .badge-out{background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.3)}
    .time-box{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
    .success-wrap{text-align:center;padding:10px 0}
    .big-emoji{font-size:72px;line-height:1;margin-bottom:16px;display:block;animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
    @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
    .success-title{font-size:26px;font-weight:800;margin-bottom:8px}
    .success-sub{font-size:15px;color:var(--muted);line-height:1.6}
    .status-chip{display:inline-block;font-size:22px;font-weight:800;padding:4px 20px;border-radius:8px;margin:6px 0}
    .loading-wrap{text-align:center;padding:40px 20px}
    .spinner{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--fire);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{color:var(--muted);font-size:15px}
    .alert-err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--red);padding:11px 14px;border-radius:10px;font-size:14px;margin-top:12px;text-align:center}
    .ghost-btn{background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;display:block;margin:14px auto 0;text-decoration:underline;text-underline-offset:3px}
    .progress-bar{height:3px;background:var(--border);border-radius:3px;margin-top:18px;overflow:hidden}
    .report-stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
    .rstat{background:var(--dark2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
    .rstat-num{font-size:26px;font-weight:800;line-height:1}
    .rstat-label{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .hist-row{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
    .hist-date{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
    .hist-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .chip{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700}
    .chip-in{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.3)}
    .chip-out{background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.3)}
    .chip-dur{background:rgba(227,179,65,.12);color:#E3B341;border:1px solid rgba(227,179,65,.3)}
    .chip-live{background:rgba(63,185,80,.2);color:var(--green);border:1px solid rgba(63,185,80,.5)}
    .back-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:16px}
    .pdf-dl-btn{width:100%;padding:14px;background:linear-gradient(135deg,#3d1a00,#7c2d00);border:1.5px solid var(--fire);border-radius:14px;color:var(--fire);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
    .progress-fill{height:100%;border-radius:3px;background:linear-gradient(to right,var(--fire),var(--fire2));animation:drain 3s linear forwards}
    @keyframes drain{from{width:100%}to{width:0%}}
  
/* Report Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;padding:20px 18px 32px;
  animation:slideUp .3s cubic-bezier(.175,.885,.32,1.1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.mini-stat{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.mini-num{font-size:22px;font-weight:800}
.mini-lbl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
.cal-wrap{background:var(--dark2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px}
.cal-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.cal-day.visited{background:rgba(63,185,80,.25);color:var(--green)}
.cal-day.today-mark{background:var(--fire);color:white}
.cal-day.absent{background:var(--border);opacity:.25}
.cal-day.pad{opacity:0;pointer-events:none}
.hist-row{background:var(--dark2);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.hist-date{font-size:12px;font-weight:700}
.hist-times{font-size:11px;color:var(--muted);margin-top:2px}
.hist-dur{font-size:11px;font-weight:700;color:var(--yellow);
  background:rgba(227,179,65,.1);border:1px solid rgba(227,179,65,.2);padding:2px 8px;border-radius:6px}
.report-link{display:block;width:100%;margin-top:12px;padding:13px;
  background:rgba(88,166,255,.08);border:1.5px solid rgba(88,166,255,.25);border-radius:12px;
  color:var(--blue);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center}
.report-link:active{transform:scale(.97)}

</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
// ⚠️ Apps Script Deployment URL इथे टाका
const API_URL = 'https://script.google.com/macros/s/AKfycbyHttuvjFLXsKhG3epvv98tElP17DlrZolwQujnoL9SLIG9sC4gdr_9x0o9vsz4ldw/exec';

const app = document.getElementById('app');

// ─── API Call — फक्त GET वापरतो (CORS issue नाही) ───
async function api(params) {
  const qs = new URLSearchParams(params).toString();
  const r  = await fetch(`${API_URL}?${qs}`, { redirect: 'follow' });
  const txt = await r.text();
  try { return JSON.parse(txt); }
  catch(e) { throw new Error('Server error: ' + txt.slice(0,100)); }
}

function header() {
  return `<div class="header">
    <div class="dumbbell-icon">🏋️</div>
    <h1>Nirman Society Gym</h1>
    <p>A Building &amp; B Building</p>
  </div><hr class="divider">`;
}

function nowIST() {
  return new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

// ─── Init ───
window.onload = async () => {
  const id = localStorage.getItem('gymMemberId');
  if (id) {
    showLoading('माहिती लोड होत आहे…');
    try {
      const r = await api({ action:'status', memberId:id });
      if (r.success) showAttendance(r.member, r.lastStatus);
      else { localStorage.removeItem('gymMemberId'); showRegForm(); }
    } catch(e) { showCriticalError(e.message); }
  } else {
    showRegForm();
  }
};

// ─── Screens ───
function showLoading(msg) {
  app.innerHTML = `${header()}<div class="loading-wrap"><div class="spinner"></div><p class="loading-text">${msg}</p></div>`;
}

function showRegForm(pre={}) {
  app.innerHTML = `${header()}
  <div class="section-title">📝 नवीन सभासद नोंदणी</div>
  <div class="form-group"><label>पूर्ण नाव</label>
    <input id="f-name" type="text" placeholder="उदा. राजेश पाटील" value="${pre.name||''}" autocomplete="name"></div>
  <div class="form-group"><label>बिल्डिंग</label>
    <select id="f-bldg">
      <option value="">— निवडा —</option>
      <option value="A Building" ${pre.building==='A Building'?'selected':''}>🅐 A Building</option>
      <option value="B Building" ${pre.building==='B Building'?'selected':''}>🅑 B Building</option>
    </select></div>
  <div class="form-group"><label>फ्लॅट नंबर</label>
    <input id="f-flat" type="text" placeholder="उदा. A-101" value="${pre.flat||''}"></div>
  <div class="form-group"><label>मोबाइल नंबर</label>
    <input id="f-phone" type="tel" placeholder="10 अंकी नंबर" maxlength="10" inputmode="numeric" value="${pre.phone||''}"></div>
  <button class="btn btn-primary" id="reg-btn" onclick="submitReg()">✅ नोंदणी करा</button>
  <div id="reg-err"></div>`;
}

function showAttendance(member, lastSt) {
  const isIn     = lastSt === 'IN';
  const initials = member.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  app.innerHTML = `${header()}
  <div class="member-card">
    <div class="member-avatar">${initials}</div>
    <div class="member-name">${member.name}</div>
    <div class="member-meta">${member.building} &nbsp;·&nbsp; फ्लॅट ${member.flat}</div>
    <span class="badge ${isIn?'badge-in':'badge-out'}">${isIn?'🟢 आत आहे':'🔴 बाहेर आहे'}</span>
  </div>
  <button class="btn ${isIn?'btn-out':'btn-in'}" id="att-btn" onclick="doAttendance('${member.id}')">
    ${isIn?'🚪 जिम सोडत आहे &nbsp;— OUT':'💪 जिमला येत आहे &nbsp;— IN'}
  </button>
  <div class="time-box">📅 ${nowIST()}</div>
  <button class="report-link" onclick="showMyReport('${member.id}')">📊 माझा Attendance Report बघा</button>
  <button class="ghost-btn" onclick="switchMember()">↩ वेगळ्या सभासदाने लॉगिन करा</button>
  <div id="att-err"></div>`;
}

function showSuccess(status, name, ts) {
  const isIn  = status === 'IN';
  const color = isIn ? 'var(--green)' : 'var(--red)';
  const chipBg= isIn ? 'rgba(63,185,80,.15)' : 'rgba(248,81,73,.15)';
  app.innerHTML = `${header()}
  <div class="success-wrap">
    <span class="big-emoji">${isIn?'💪':'👋'}</span>
    <div class="success-title" style="color:${color}">${isIn?'व्यायामासाठी स्वागत!':'पुन्हा या!'}</div>
    <p class="success-sub"><strong>${name}</strong> यांची नोंद झाली<br>
      <span class="status-chip" style="background:${chipBg};color:${color}">${status}</span></p>
    <div class="time-box" style="margin-top:14px">⏰ ${ts}</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>`;

  setTimeout(async () => {
    const id = localStorage.getItem('gymMemberId');
    if (!id) return;
    try {
      const s = await api({ action:'status', memberId:id });
      if (s.success) showAttendance(s.member, s.lastStatus);
    } catch(e) {}
  }, 3000);
}

function showCriticalError(msg) {
  app.innerHTML = `${header()}
  <div style="text-align:center;padding:24px 0">
    <span style="font-size:52px">⚠️</span>
    <p style="color:var(--muted);margin-top:12px;font-size:15px;line-height:1.6">
      कनेक्शन त्रुटी आली.<br>Apps Script Redeploy करा.
    </p>
    <button class="btn btn-primary" style="margin-top:20px" onclick="location.reload()">🔄 पुन्हा प्रयत्न करा</button>
  </div>`;
}

// ─── Actions ───
async function submitReg() {
  const name  = document.getElementById('f-name').value.trim();
  const bldg  = document.getElementById('f-bldg').value;
  const flat  = document.getElementById('f-flat').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const err   = document.getElementById('reg-err');

  if (!name||!bldg||!flat||!phone) {
    err.innerHTML='<div class="alert-err">⚠️ सर्व माहिती भरणे आवश्यक आहे</div>'; return;
  }
  if (!/^\d{10}$/.test(phone)) {
    err.innerHTML='<div class="alert-err">⚠️ 10 अंकी मोबाइल नंबर टाका</div>'; return;
  }

  document.getElementById('reg-btn').disabled = true;
  showLoading('नोंदणी होत आहे…');

  try {
    const r = await api({ action:'register', name, flat, building:bldg, phone });
    if (r.success || r.alreadyRegistered) {
      localStorage.setItem('gymMemberId', r.memberId);
      const s = await api({ action:'status', memberId:r.memberId });
      if (s.success) showAttendance(s.member, s.lastStatus);
    } else {
      showRegForm({ name, building:bldg, flat, phone });
      document.getElementById('reg-err').innerHTML =
        `<div class="alert-err">⚠️ ${r.message}</div>`;
    }
  } catch(e) { showCriticalError(e.message); }
}

async function doAttendance(memberId) {
  document.getElementById('att-btn').disabled = true;
  showLoading('नोंद होत आहे…');
  try {
    const r = await api({ action:'attendance', memberId });
    if (r.success) showSuccess(r.status, r.name, r.timestamp);
    else showCriticalError(r.message);
  } catch(e) { showCriticalError(e.message); }
}

function switchMember() {
  if (confirm('तुमचे लॉगिन काढले जाईल. खात्री आहे का?')) {
    localStorage.removeItem('gymMemberId');
    showRegForm();
  }
}

// ── My Report Modal ────────────────────────────────────
async function showMyReport(memberId) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">📊 माझा Report</div>
      <div class="loading-wrap"><div class="spinner"></div><p class="loading-text">लोड होत आहे…</p></div>
    </div>`;
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  try {
    const r = await api({ action:'memberReport', memberId });
    const sheet = overlay.querySelector('.modal-sheet');
    if (!r.success) {
      sheet.innerHTML = `<div class="modal-handle"></div><p style="color:var(--red);text-align:center;padding:24px">${r.message}</p>`;
      return;
    }
    sheet.innerHTML = `
      <div class="modal-handle"></div>
      <div class="modal-title">📊 ${r.member.name}</div>
      <div class="mini-stats">
        <div class="mini-stat">
          <div class="mini-num" style="color:var(--green)">${r.totalVisits}</div>
          <div class="mini-lbl">एकूण Visits</div>
        </div>
        <div class="mini-stat">
          <div class="mini-num" style="color:var(--blue)">${r.monthVisits}</div>
          <div class="mini-lbl">या महिन्यात</div>
        </div>
        <div class="mini-stat">
          <div class="mini-num" style="color:var(--yellow);font-size:14px;line-height:1.2">${r.totalTime}</div>
          <div class="mini-lbl">एकूण वेळ</div>
        </div>
      </div>
      <div class="cal-wrap">
        <div class="cal-title">📅 गेल्या 30 दिवसांची हजेरी</div>
        <div class="cal-grid">${buildCal(r.last30)}</div>
        <div style="display:flex;gap:14px;margin-top:10px;font-size:10px;color:var(--muted)">
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(63,185,80,.25);margin-right:4px;vertical-align:middle"></span>गेलो</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--fire);margin-right:4px;vertical-align:middle"></span>आज</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--border);margin-right:4px;vertical-align:middle;opacity:.25"></span>गेलो नाही</span>
        </div>
      </div>
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">📋 शेवटच्या नोंदी</div>
      ${r.history.length
        ? r.history.map(h=>`
          <div class="hist-row">
            <div>
              <div class="hist-date">${h.date}</div>
              <div class="hist-times">🟢 IN: ${h.inTime||'—'}${h.outTime?' &nbsp;🔴 OUT: '+h.outTime:' &nbsp;<span style="color:var(--green);font-size:10px">अजून आत</span>'}</div>
            </div>
            ${h.duration?'<span class="hist-dur">⏱ '+h.duration+' मिनिटे</span>':''}
          </div>`).join('')
        : '<div class="empty">अजून कोणतीही नोंद नाही</div>'}
      <button onclick="document.querySelector('.modal-overlay').remove()"
        style="width:100%;margin-top:16px;padding:14px;background:var(--dark2);
               border:1.5px solid var(--border);border-radius:12px;color:var(--muted);
               font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">
        ✕ बंद करा
      </button>`;
  } catch(e) {
    overlay.querySelector('.modal-sheet').innerHTML +=
      `<p style="color:var(--red);text-align:center;padding:20px">⚠️ ${e.message}</p>`;
  }
}

function buildCal(last30) {
  const entries = Object.entries(last30);
  const todayStr = new Date().toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata'});
  const firstDate = new Date(); firstDate.setDate(firstDate.getDate()-29);
  const startDay = firstDate.getDay();
  let html = '';
  for(let i=0;i<startDay;i++) html += '<div class="cal-day pad"></div>';
  entries.forEach(([date,count]) => {
    const isT = date===todayStr;
    const cls = isT?'today-mark':count>0?'visited':'absent';
    const d = date.split('/')[0];
    html += `<div class="cal-day ${cls}" title="${date}">${d}</div>`;
  });
  return html;
}

</script>
